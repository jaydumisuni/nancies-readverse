name: Verify production ReadVerse functions

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/verify-production-functional.yml

permissions:
  contents: read

jobs:
  verify-production-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser verifier
        run: |
          npm install --no-audit --no-fund
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Exercise production end to end
        env:
          READVERSE_URL: https://nancies-readverse.pharrtechnolgiescoltd.workers.dev
        run: |
          mkdir -p production-functional-evidence
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const { chromium } = require('playwright');

          const base = process.env.READVERSE_URL.replace(/\/$/, '');
          const companions = ['Gojo', 'Itachi', 'Naruto', 'Kakashi', 'Megumi', 'Sasuke', 'Maki', 'Nobara', 'Hinata', 'Sakura', 'Temari', 'Mei Mei'];
          const report = { status: 'running', productionUrl: base, checkedAt: new Date().toISOString(), companions: {}, checks: [], consoleErrors: [] };

          async function api(path, init) {
            let lastError;
            for (let attempt = 1; attempt <= 3; attempt += 1) {
              try {
                const response = await fetch(`${base}${path}`, init);
                const text = await response.text();
                let body;
                try { body = JSON.parse(text); } catch { body = { raw: text }; }
                if (!response.ok) throw new Error(`${path} returned ${response.status}: ${body.error || text.slice(0, 180)}`);
                return body;
              } catch (error) {
                lastError = error;
                if (attempt < 3) await new Promise(resolve => setTimeout(resolve, 1500 * attempt));
              }
            }
            throw lastError;
          }

          (async () => {
            const health = await api('/api/health');
            assert.equal(health.status, 'transient-reader');
            assert.equal(health.storage, 'no permanent Cloudflare copies');
            report.checks.push('Production Worker health and transient-storage policy');

            await Promise.all(companions.map(async companion => {
              const firstQuestion = 'Recommend a clever dark read without spoilers.';
              const first = await api('/api/companion/help', {
                method: 'POST', headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ question: firstQuestion, companion, history: [] }),
              });
              assert.ok(typeof first.answer === 'string' && first.answer.length >= 20, `${companion} first answer failed`);
              const second = await api('/api/companion/help', {
                method: 'POST', headers: { 'content-type': 'application/json' },
                body: JSON.stringify({
                  question: 'Now make that advice practical for a temporary PDF session.',
                  companion,
                  history: [
                    { role: 'user', text: firstQuestion },
                    { role: 'assistant', text: first.answer },
                  ],
                }),
              });
              assert.ok(typeof second.answer === 'string' && second.answer.length >= 20, `${companion} second answer failed`);
              assert.notEqual(second.answer, first.answer, `${companion} repeated the same answer`);
              report.companions[companion] = { first: first.answer, second: second.answer, modes: [first.mode, second.mode] };
            }));
            report.checks.push('All twelve companions completed distinct two-turn conversations');

            const fixtureUrl = `${base}/fixtures/source-with-ads.html`;
            const resolved = await api('/api/source/resolve', {
              method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ url: fixtureUrl }),
            });
            assert.ok(resolved.source?.streamUrl);
            assert.ok(resolved.source.directUrl.includes('/fixtures/sample.pdf'));
            assert.doesNotMatch(resolved.source.directUrl, /utm_|campaign=|ads\.invalid|tracker\.invalid/i);
            const stream = await fetch(`${base}${resolved.source.streamUrl}`);
            assert.equal(stream.status, 200);
            assert.match(stream.headers.get('content-type') || '', /application\/pdf/);
            assert.equal(stream.headers.get('x-readverse-storage'), 'temporary-stream');
            report.checks.push('Ad-filled source page resolved to the clean temporary PDF stream');

            const browser = await chromium.launch({ headless: true });
            const mobile = await browser.newContext({ viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true });
            const mobilePage = await mobile.newPage();
            mobilePage.on('console', message => { if (message.type() === 'error') report.consoleErrors.push(`mobile: ${message.text()}`); });
            mobilePage.on('pageerror', error => report.consoleErrors.push(`mobile: ${error.message}`));
            await mobilePage.goto(base, { waitUntil: 'networkidle', timeout: 90000 });
            assert.equal(await mobilePage.locator('.mobile-brand span').textContent(), 'Nancy’s');
            assert.equal(await mobilePage.locator('.mobile-brand strong').textContent(), 'READVERSE');
            const overflow = await mobilePage.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth);
            assert.ok(overflow <= 1, `Mobile overflow ${overflow}px`);
            await mobilePage.screenshot({ path: 'production-functional-evidence/mobile-production.png', fullPage: true });
            await mobile.close();
            report.checks.push('Production mobile wordmark and responsive layout');

            const desktop = await browser.newContext({ viewport: { width: 1918, height: 1016 } });
            const page = await desktop.newPage();
            page.on('console', message => { if (message.type() === 'error') report.consoleErrors.push(`desktop: ${message.text()}`); });
            page.on('pageerror', error => report.consoleErrors.push(`desktop: ${error.message}`));
            await page.goto(base, { waitUntil: 'networkidle', timeout: 90000 });
            assert.equal(await page.locator('.brand span').textContent(), "Nancy's");
            assert.ok(await page.locator('.companion-panel.open').isVisible());
            assert.ok(await page.getByText('Ten lanes. Two verifiers. No waiting politely in line.').isVisible());
            await page.screenshot({ path: 'production-functional-evidence/desktop-production.png', fullPage: true });
            report.checks.push('Production desktop dashboard and fixed companion chat');

            const pdf = fs.readFileSync('public/fixtures/sample.pdf');
            await page.locator('input[type="file"][accept*=".pdf"]').setInputFiles({ name: 'nancy-production-proof.pdf', mimeType: 'application/pdf', buffer: pdf });
            await page.getByRole('button', { name: 'Read now' }).last().click();
            await page.locator('.reader-document[src^="blob:"]').waitFor({ state: 'visible', timeout: 15000 });
            assert.ok(await page.getByText('Temporary PDF session').isVisible());
            const uploadMessage = await page.locator('.message-bubble').last().innerText();
            assert.match(uploadMessage, /No copy was uploaded to Cloudflare/);
            assert.match(uploadMessage, /Google Drive is not connected yet/);
            await page.screenshot({ path: 'production-functional-evidence/pdf-production.png', fullPage: false });
            report.checks.push('Production chat upload opened a real session-only PDF');

            await page.locator('.reader-toolbar button[aria-label="Close reader"]').click();
            await page.getByRole('button', { name: 'Sources' }).click();
            await page.locator('.source-dialog input[type=url]').fill(fixtureUrl);
            await page.locator('.source-submit').click();
            await page.locator('.reader-document[src*="/api/source/stream"]').waitFor({ state: 'visible', timeout: 20000 });
            const sourceMessage = await page.locator('.message-bubble').last().innerText();
            assert.match(sourceMessage, /opened it temporarily/);
            assert.match(sourceMessage, /not a permanent copy/);
            await page.screenshot({ path: 'production-functional-evidence/source-production.png', fullPage: false });
            report.checks.push('Production source dialog opened the verified temporary stream');

            await desktop.close();
            await browser.close();
            assert.deepEqual(report.consoleErrors, []);
            report.status = 'passed';
            fs.writeFileSync('production-functional-evidence/report.json', JSON.stringify(report, null, 2));
            console.log(JSON.stringify(report, null, 2));
          })().catch(error => {
            report.status = 'failed';
            report.error = String(error);
            report.stack = error.stack;
            fs.writeFileSync('production-functional-evidence/report.json', JSON.stringify(report, null, 2));
            console.error(error);
            process.exit(1);
          });
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-functional-evidence
          path: production-functional-evidence
          if-no-files-found: error
