name: Apply and prove NoTVerse workspace correction

on:
  push:
    branches:
      - fix-notverse-responsive-chat-notes-20260803

permissions:
  contents: write

jobs:
  apply-build-review-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact proof branch
        uses: actions/checkout@v4
        with:
          ref: fix-notverse-responsive-chat-notes-20260803
          fetch-depth: 0

      - name: Recover exact workspace product correction
        run: |
          base64 -d .workspace/notverse-responsive-intelligence.patch.gz.b64 | gzip -d > /tmp/notverse-responsive-product.patch
          git apply --check /tmp/notverse-responsive-product.patch
          git apply /tmp/notverse-responsive-product.patch
          git apply --check .workspace/proof-filter.patch
          git apply .workspace/proof-filter.patch

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Strict build and architecture review
        run: npm run build

      - name: Install browser proof tooling
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start exact production client locally
        run: |
          cat > /tmp/serve_notverse.py <<'PY'
          import json
          from http.server import ThreadingHTTPServer, SimpleHTTPRequestHandler
          from functools import partial

          class Handler(SimpleHTTPRequestHandler):
              def do_GET(self):
                  if self.path.split('?', 1)[0] == '/api/auth/google/status':
                      payload = json.dumps({'configured': False, 'connected': False, 'account': None}).encode('utf-8')
                      self.send_response(200)
                      self.send_header('Content-Type', 'application/json')
                      self.send_header('Content-Length', str(len(payload)))
                      self.end_headers()
                      self.wfile.write(payload)
                      return
                  return super().do_GET()

          ThreadingHTTPServer(('127.0.0.1', 4173), partial(Handler, directory='dist/client')).serve_forever()
          PY
          python3 /tmp/serve_notverse.py > /tmp/notverse-preview.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/notverse-preview.log
          exit 1

      - name: Existing proof — setup, navigation and social workspaces
        run: node scripts/verify-notverse-ui.mjs
        env:
          NOTVERSE_TEST_URL: http://127.0.0.1:4173

      - name: Existing proof — reader, Notes and Library handoff
        run: node scripts/verify-notverse-reader-ui.mjs
        env:
          NOTVERSE_TEST_URL: http://127.0.0.1:4173

      - name: Existing proof — persistent Inbox messaging
        run: node scripts/verify-notverse-inbox-ui.mjs
        env:
          NOTVERSE_TEST_URL: http://127.0.0.1:4173

      - name: Existing proof — approved branding and mobile chat
        run: node scripts/verify-notverse-brand-mobile-chat.mjs
        env:
          NOTVERSE_TEST_URL: http://127.0.0.1:4173

      - name: New proof — responsive Notes, adaptive chat and useful recommendations
        run: node scripts/verify-notverse-responsive-intelligence.mjs
        env:
          NOTVERSE_TEST_URL: http://127.0.0.1:4173

      - name: Preserve proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notverse-responsive-chat-notes-proof
          path: |
            engineering-evidence/notverse
            engineering-evidence/notverse-brand-mobile
            engineering-evidence/notverse-responsive
            /tmp/notverse-preview.log
          if-no-files-found: warn
          retention-days: 14

      - name: Freeze only the fully proven product correction
        run: |
          git show origin/main:.github/workflows/finish-notverse-10-for-2.yml > /tmp/finish-notverse.yml
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/finish-notverse.yml')
          text = path.read_text()
          gate = '''      - name: Proof gate 2E — responsive Notes, adaptive chat and useful recommendations
                run: node scripts/verify-notverse-responsive-intelligence.mjs
                env:
                  NOTVERSE_TEST_URL: http://127.0.0.1:4173

          '''
          marker = '      - name: Preserve proof report and server log\n'
          if 'verify-notverse-responsive-intelligence.mjs' not in text:
              text = text.replace(marker, gate + marker)
          text = text.replace('            engineering-evidence/notverse-brand-mobile\n', '            engineering-evidence/notverse-brand-mobile\n            engineering-evidence/notverse-responsive\n')
          Path('.github/workflows/finish-notverse-10-for-2.yml').write_text(text)
          PY
          git restore package.json package-lock.json 2>/dev/null || true
          git restore engineering-evidence 2>/dev/null || true
          git clean -fd engineering-evidence/notverse-responsive 2>/dev/null || true
          rm -f .workspace/notverse-responsive-intelligence.patch.gz.b64
          rm -f .workspace/proof-filter.patch
          rm -f .github/workflows/apply-workspace-responsive-correction.yml
          rmdir .workspace 2>/dev/null || true
          git config user.name "NoTVerse Verification"
          git config user.email "verification@thetechguyds.com"
          git add -A
          git commit -m "Fix responsive Notes, adaptive chat and companion recommendations"
          git push origin HEAD:fix-notverse-responsive-chat-notes-20260803
