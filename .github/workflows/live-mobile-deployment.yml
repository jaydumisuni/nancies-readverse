name: Live mobile deployment verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-live-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-live-mobile-brand.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readverse-live-mobile-evidence
          path: mobile-deployment-evidence
          if-no-files-found: warn
