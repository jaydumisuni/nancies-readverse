name: Create compact NoTVerse proof thumbnails

on:
  push:
    branches: [verify-notverse-before-deploy-20260730]

jobs:
  thumbnails:
    if: ${{ !contains(github.event.head_commit.message, '[thumbs]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build readable proof images from fresh screenshots
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path

          src = Path('engineering-evidence/current-notverse')
          out = src / 'compact-proof'
          out.mkdir(parents=True, exist_ok=True)

          def fit_width(name, output, width, quality=28):
              image = Image.open(src / name).convert('RGB')
              height = round(image.height * width / image.width)
              image = image.resize((width, height), Image.Resampling.LANCZOS)
              image.save(out / output, 'JPEG', quality=quality, optimize=True)

          def crop_mobile(name, prefix, width=340, quality=30):
              image = Image.open(src / name).convert('RGB')
              target_height = round(image.height * width / image.width)
              image = image.resize((width, target_height), Image.Resampling.LANCZOS)
              segment = min(560, target_height)
              top = image.crop((0, 0, width, segment))
              bottom = image.crop((0, max(0, target_height-segment), width, target_height))
              top.save(out / f'{prefix}-top.jpg', 'JPEG', quality=quality, optimize=True)
              bottom.save(out / f'{prefix}-bottom.jpg', 'JPEG', quality=quality, optimize=True)

          for name, output in [
              ('setup-cover-desktop.png', 'setup-cover-readable.jpg'),
              ('home-desktop.png', 'home-desktop-readable.jpg'),
              ('search-desktop.png', 'search-desktop-readable.jpg'),
              ('notes-desktop.png', 'notes-desktop-readable.jpg'),
          ]:
              fit_width(name, output, 560)

          crop_mobile('home-mobile.png', 'home-mobile')
          crop_mobile('notes-mobile.png', 'notes-mobile')
          crop_mobile('note-composer-mobile.png', 'composer-mobile')

          names = [
              'setup-cover-desktop.png',
              'home-desktop.png',
              'search-desktop.png',
              'notes-desktop.png',
              'home-mobile.png',
              'note-composer-mobile.png',
          ]
          micro_tiles = []
          for name in names:
              micro = Image.open(src / name).convert('RGB')
              micro.thumbnail((150, 92))
              tile = Image.new('RGB', (160, 115), '#09070c')
              tile.paste(micro, ((160-micro.width)//2, 17+(92-micro.height)//2))
              ImageDraw.Draw(tile).text((5, 3), name.split('.')[0][:19], fill='white')
              micro_tiles.append(tile)
          sheet = Image.new('RGB', (320, 345), '#050408')
          for index, tile in enumerate(micro_tiles):
              sheet.paste(tile, ((index % 2) * 160, (index // 2) * 115))
          sheet.save(out / 'micro-proof.jpg', 'JPEG', quality=24, optimize=True)
          PY
      - name: Commit readable visual proof
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add engineering-evidence/current-notverse/compact-proof
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '[thumbs] Add readable NoTVerse proof images'
          git push
