name: ReadVerse CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type check
        id: typecheck
        continue-on-error: true
        run: |
          npm run check > typecheck.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload type-check diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log

      - name: Fail on type errors
        if: steps.typecheck.outputs.exit_code != '0'
        run: cat typecheck.log && exit 1

      - name: Build Worker and frontend
        run: npm run build
