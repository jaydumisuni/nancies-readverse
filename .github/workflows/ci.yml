name: ReadVerse CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type check
        id: typecheck
        continue-on-error: true
        run: |
          npm run check > typecheck.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Build Worker and frontend
        id: buildapp
        continue-on-error: true
        run: |
          npm run build > build.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload diagnostics and hydrated source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readverse-diagnostics
          path: |
            typecheck.log
            build.log
            src/App.tsx
            src/styles.css
            src/avatars.ts
            src/avatarsD.ts
            public/avatars/meimei.svg

      - name: Fail on validation errors
        if: steps.typecheck.outputs.exit_code != '0' || steps.buildapp.outputs.exit_code != '0'
        run: |
          cat typecheck.log
          cat build.log
          exit 1