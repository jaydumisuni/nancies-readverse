name: ReadVerse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify architecture, types and production build
        run: npm run build

  verify-live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Verify live storage, reader, source resolver and all companions
        run: node scripts/verify-live-core.mjs
        env:
          READVERSE_URL: https://nancyreadverse.1ink.online/

      - name: Upload live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readverse-live-evidence
          path: live-evidence
          if-no-files-found: warn
