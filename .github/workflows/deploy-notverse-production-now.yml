name: Deploy NoTVerse production now

on:
  push:
    branches: [deploy-notverse-production-now]
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'deploy-notverse-production-now'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy-notverse-production-now
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Confirm Cloudflare deployment credentials exist
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "Missing CLOUDFLARE_API_TOKEN/CF_API_TOKEN repository secret"; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "Missing CLOUDFLARE_ACCOUNT_ID/CF_ACCOUNT_ID repository secret"; exit 3; }
          echo "Cloudflare deployment credentials are available"
      - name: Install and build canonical NoTVerse
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Deploy canonical generated Worker configuration
        run: npx wrangler deploy --config dist/nancies_readverse/wrangler.json
      - name: Verify live Worker identity
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsSL --connect-timeout 15 --max-time 45 https://nancies-readverse.pharrtechnolgiescoltd.workers.dev/api/health -o /tmp/health.json; then
              cat /tmp/health.json
              jq -e '.ok == true and .app == "NoTVerse"' /tmp/health.json >/dev/null && exit 0
            fi
            sleep 10
          done
          echo "Deployment finished but live identity did not switch to NoTVerse"
          exit 1
