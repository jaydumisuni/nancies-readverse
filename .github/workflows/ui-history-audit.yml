name: UI history audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium
      - name: Capture historical UIs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ui-history
          COMMITS=(
            "b6fa29d06ea272b4068690912aedc756c575d9a6"
            "47949f95d7aad7e5da321e043c8f78b81b51358f"
            "507906f4efd2d423277f9fe5868edff590553be8"
            "0ed6ee6de84f1e41587cf3d54f715154da452ee8"
            "87a873e149bd7ad39095e2319cfda374f5b839e9"
          )
          for SHA in "${COMMITS[@]}"; do
            SHORT="${SHA:0:7}"
            DIR="/tmp/readverse-$SHORT"
            git worktree add --detach "$DIR" "$SHA"
            pushd "$DIR"
            npm install --no-audit --no-fund
            npm run build
            (npx vite preview --host 127.0.0.1 --port 4173 >"/tmp/$SHORT-vite.log" 2>&1 & echo $! >"/tmp/$SHORT-vite.pid")
            for i in {1..60}; do
              if curl -fsS http://127.0.0.1:4173 >/dev/null; then break; fi
              sleep 1
            done
            node - "$SHORT" "$GITHUB_WORKSPACE/ui-history" <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const short = process.argv[2];
          const out = process.argv[3];
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const targets = [
              { name: 'desktop', width: 1440, height: 1100, isMobile: false },
              { name: 'mobile', width: 390, height: 844, isMobile: true },
            ];
            for (const t of targets) {
              const context = await browser.newContext({ viewport: { width: t.width, height: t.height }, isMobile: t.isMobile, deviceScaleFactor: 1 });
              const page = await context.newPage();
              const errors = [];
              page.on('console', msg => { if (msg.type() === 'error') errors.push(msg.text()); });
              page.on('pageerror', err => errors.push(String(err)));
              await page.goto('http://127.0.0.1:4173', { waitUntil: 'networkidle', timeout: 90000 });
              await page.screenshot({ path: `${out}/${short}-${t.name}.png`, fullPage: true });
              fs.writeFileSync(`${out}/${short}-${t.name}.json`, JSON.stringify({ title: await page.title(), url: page.url(), errors }, null, 2));
              await context.close();
            }
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
            kill "$(cat /tmp/$SHORT-vite.pid)" || true
            popd
            git worktree remove --force "$DIR"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: readverse-ui-history
          path: ui-history
          if-no-files-found: error
