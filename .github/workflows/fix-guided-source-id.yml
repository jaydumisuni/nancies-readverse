name: Fix guided source identity

on:
  push:
    branches: [implement-guided-discovery-library]
    paths:
      - .github/workflows/fix-guided-source-id.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implement-guided-discovery-library
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Correct source identity handling
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('src/App.tsx')
          text = path.read_text()
          old = '''    return body.source;
  }
'''
          new = '''    return {
      ...body.source,
      id: body.source.id || `source-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
    };
  }
'''
          if old not in text:
              raise SystemExit('resolveSourceCandidate return block not found')
          text = text.replace(old, new, 1)
          old = '''  function updateSourceCard(sourceId: string, updater: (card: SourceCard) => SourceCard) {
    setMessages((current) => current.map((message) => message.sourceCard?.source.id === sourceId
      ? { ...message, sourceCard: updater(message.sourceCard) }
      : message));
  }
'''
          new = '''  function updateSourceCard(sourceId: string, updater: (card: SourceCard) => SourceCard) {
    if (!sourceId) return;
    setMessages((current) => current.map((message) => {
      const card = message.sourceCard;
      return card?.source?.id === sourceId
        ? { ...message, sourceCard: updater(card) }
        : message;
    }));
  }
'''
          if old not in text:
              raise SystemExit('updateSourceCard block not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Strict build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ReadVerse Engineering"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "Stabilise guided source identity" || exit 0
          git push origin HEAD:implement-guided-discovery-library
