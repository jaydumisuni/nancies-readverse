name: Export exact current NoTVerse source 20260804

on:
  push:
    branches:
      - workspace-export-notverse-current-20260804
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package exact current source
        run: tar --exclude=.git --exclude=node_modules --exclude=dist --exclude=.wrangler -czf /tmp/notverse-current-source-20260804.tar.gz .

      - name: Upload exact current source
        uses: actions/upload-artifact@v4
        with:
          name: notverse-current-workspace-source-20260804
          path: /tmp/notverse-current-source-20260804.tar.gz
          retention-days: 2
