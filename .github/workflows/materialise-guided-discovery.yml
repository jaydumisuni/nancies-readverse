name: Materialise guided discovery branch source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/materialise-guided-discovery.yml

permissions:
  contents: write

jobs:
  materialise:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implement-guided-discovery-library
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run source materialisation
        id: transform
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node scripts/run-guided-discovery-transform.mjs > /tmp/materialise.log 2>&1
          STATUS=$?
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          cat /tmp/materialise.log
          exit $STATUS
      - name: Run strict build
        id: build
        if: steps.transform.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm install --no-audit --no-fund > /tmp/install.log 2>&1
          INSTALL_STATUS=$?
          npm run verify:architecture > /tmp/architecture.log 2>&1
          ARCH_STATUS=$?
          npx tsc --noEmit > /tmp/types.log 2>&1
          TYPE_STATUS=$?
          npx vite build > /tmp/vite.log 2>&1
          VITE_STATUS=$?
          printf 'install=%s\narchitecture=%s\ntypes=%s\nvite=%s\n' "$INSTALL_STATUS" "$ARCH_STATUS" "$TYPE_STATUS" "$VITE_STATUS" > /tmp/build-status.txt
          cat /tmp/build-status.txt
          cat /tmp/architecture.log || true
          cat /tmp/types.log || true
          cat /tmp/vite.log || true
          test "$INSTALL_STATUS" -eq 0 -a "$ARCH_STATUS" -eq 0 -a "$TYPE_STATUS" -eq 0 -a "$VITE_STATUS" -eq 0
      - name: Commit result to implementation branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p engineering-diagnostics
          cp /tmp/materialise.log engineering-diagnostics/materialise.log 2>/dev/null || true
          cp /tmp/install.log engineering-diagnostics/install.log 2>/dev/null || true
          cp /tmp/architecture.log engineering-diagnostics/architecture.log 2>/dev/null || true
          cp /tmp/types.log engineering-diagnostics/types.log 2>/dev/null || true
          cp /tmp/vite.log engineering-diagnostics/vite.log 2>/dev/null || true
          cp /tmp/build-status.txt engineering-diagnostics/build-status.txt 2>/dev/null || true
          printf 'workflow_ran=true\ntransform=%s\nbuild=%s\n' '${{ steps.transform.outcome }}' '${{ steps.build.outcome }}' > engineering-diagnostics/workflow-status.txt
          git config user.name "ReadVerse Engineering"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.tsx src/reader/PdfBookReader.tsx src/styles.css worker/index.ts engineering-diagnostics
          git commit -m "Materialise guided discovery implementation" || git commit --allow-empty -m "Record guided discovery materialisation failure"
          git push origin HEAD:implement-guided-discovery-library
