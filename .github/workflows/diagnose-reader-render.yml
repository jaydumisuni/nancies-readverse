name: Diagnose PDF page rendering

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/diagnose-reader-render.mjs
      - run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit diagnostics and remove patch machinery
        run: |
          rm scripts/diagnose-reader-render.mjs
          rm .github/workflows/diagnose-reader-render.yml
          rm -f package-lock.json
          git config user.name "ReadVerse Reader Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Expose PDF render failures during verification"
          git push origin HEAD:${{ github.head_ref }}
