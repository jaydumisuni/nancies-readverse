name: Apply approved reader upgrade

on:
  push:
    branches: [rebuild-approved-ui]
    paths:
      - scripts/apply-approved-reader-upgrade.mjs
      - .github/workflows/apply-approved-reader.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-approved-ui
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-approved-reader-upgrade.mjs
      - name: Commit the verified source and remove temporary upgrade machinery
        run: |
          rm scripts/apply-approved-reader-upgrade.mjs
          rm .github/workflows/apply-approved-reader.yml
          git config user.name "ReadVerse UI Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.tsx scripts/apply-approved-reader-upgrade.mjs .github/workflows/apply-approved-reader.yml
          git commit -m "Open temporary files in the approved reader"
          git push origin HEAD:rebuild-approved-ui
