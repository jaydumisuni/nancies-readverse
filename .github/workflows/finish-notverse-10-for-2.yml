name: Finish NoTVerse 10-for-2 proof

on:
  push:
    branches:
      - finish-notverse-10-for-2-20260731
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  strict-build-and-visual-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Proof gate 1 — strict build and architecture
        run: npm run build

      - name: Install browser proof tooling
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start exact production client locally
        run: |
          cat > /tmp/serve_notverse.py <<'PY'
          import json
          from http.server import ThreadingHTTPServer, SimpleHTTPRequestHandler
          from functools import partial

          class Handler(SimpleHTTPRequestHandler):
              def do_GET(self):
                  if self.path.split('?', 1)[0] == '/api/auth/google/status':
                      payload = json.dumps({
                          'configured': False,
                          'connected': False,
                          'account': None,
                      }).encode('utf-8')
                      self.send_response(200)
                      self.send_header('Content-Type', 'application/json')
                      self.send_header('Content-Length', str(len(payload)))
                      self.end_headers()
                      self.wfile.write(payload)
                      return
                  return super().do_GET()

          server = ThreadingHTTPServer(
              ('127.0.0.1', 4173),
              partial(Handler, directory='dist/client'),
          )
          server.serve_forever()
          PY
          python3 /tmp/serve_notverse.py > /tmp/notverse-preview.log 2>&1 &
          echo $! > /tmp/notverse-preview.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/notverse-preview.log
          exit 1

      - name: Proof gate 2A — setup, navigation and social workspaces
        run: node scripts/verify-notverse-ui.mjs
        env:
          NOTVERSE_TEST_URL: http://127.0.0.1:4173

      - name: Proof gate 2B — temporary reader, Notes and Library handoff
        run: node scripts/verify-notverse-reader-ui.mjs
        env:
          NOTVERSE_TEST_URL: http://127.0.0.1:4173

      - name: Proof gate 2C — persistent Inbox messaging
        run: node scripts/verify-notverse-inbox-ui.mjs
        env:
          NOTVERSE_TEST_URL: http://127.0.0.1:4173

      - name: Preserve proof report and server log
        if: always()
        run: |
          cp /tmp/notverse-preview.log engineering-evidence/notverse/preview.log 2>/dev/null || true
          printf '%s\n' '${{ github.sha }}' > engineering-evidence/notverse/verified-commit.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finish-notverse-10-for-2-evidence
          path: engineering-evidence/notverse
          if-no-files-found: error
          retention-days: 14
