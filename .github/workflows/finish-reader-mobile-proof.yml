name: Finish physical reader mobile proof

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/finish-reader-mobile-proof.mjs
      - run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit canonical changes and remove patch machinery
        run: |
          rm scripts/finish-reader-mobile-proof.mjs
          rm .github/workflows/finish-reader-mobile-proof.yml
          rm -f package-lock.json
          git config user.name "ReadVerse Reader Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Finish the mobile physical reader proof"
          git push origin HEAD:${{ github.head_ref }}
