name: Verify live approved NoTVerse branding

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact merged release
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install browser proof tooling
        run: npm install --no-save --no-audit --no-fund playwright@1.62.1

      - name: Build exact production bundle
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for production to serve the exact merged assets
        shell: bash
        run: |
          set -euo pipefail
          js_asset=$(grep -oE '/assets/[^" ]+\.js' dist/client/index.html | head -n 1)
          css_asset=$(grep -oE '/assets/[^" ]+\.css' dist/client/index.html | head -n 1)
          test -n "$js_asset"
          test -n "$css_asset"
          printf 'Expected JS: %s\nExpected CSS: %s\n' "$js_asset" "$css_asset"
          ready=0
          for attempt in $(seq 1 120); do
            html=$(curl -fsSL --retry 2 --connect-timeout 15 "https://notverse.1ink.online/?approved-brand-proof=${GITHUB_SHA}-${attempt}" || true)
            if printf '%s' "$html" | grep -Fq "$js_asset" && printf '%s' "$html" | grep -Fq "$css_asset"; then
              curl -fsSL --retry 3 "https://notverse.1ink.online/notverse-icon.webp?approved-brand-proof=${GITHUB_SHA}" -o /tmp/live-notverse-icon.webp
              if cmp -s public/notverse-icon.webp /tmp/live-notverse-icon.webp; then
                printf '%s' "$html" > engineering-evidence/live-approved-brand.html
                printf '%s\n%s\n' "$js_asset" "$css_asset" > engineering-evidence/live-approved-assets.txt
                ready=1
                break
              fi
            fi
            echo "Production has not promoted the exact approved-brand release yet (${attempt}/120)."
            sleep 10
          done
          test "$ready" -eq 1

      - name: Run live desktop/mobile identity and chat proof
        env:
          NOTVERSE_TEST_URL: https://notverse.1ink.online
        run: node scripts/verify-notverse-brand-mobile-chat.mjs

      - name: Record verified release commit
        run: printf '%s\n' "$GITHUB_SHA" > engineering-evidence/live-approved-commit.txt

      - name: Upload live proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notverse-live-approved-brand-proof
          path: |
            engineering-evidence/notverse-brand-mobile
            engineering-evidence/live-approved-brand.html
            engineering-evidence/live-approved-assets.txt
            engineering-evidence/live-approved-commit.txt
          retention-days: 14
