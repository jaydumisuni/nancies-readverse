name: Verify NoTVerse custom domain visually

on:
  push:
    branches:
      - verify-notverse-live-20260801
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  live-custom-domain-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Capture the live custom domain and Worker origin
        id: capture
        continue-on-error: true
        run: node scripts/capture-notverse-live.mjs

      - name: Verify exact live shell at desktop, tablet and mobile sizes
        id: shell
        continue-on-error: true
        env:
          NOTVERSE_URL: https://notverse.1ink.online/
        run: node scripts/verify-notverse-live.mjs

      - name: Verify live setup, navigation and social workspaces
        id: ui
        continue-on-error: true
        env:
          NOTVERSE_TEST_URL: https://notverse.1ink.online
        run: node scripts/verify-notverse-ui.mjs

      - name: Verify live reader, Notes and Library handoff
        id: reader
        continue-on-error: true
        env:
          NOTVERSE_TEST_URL: https://notverse.1ink.online
        run: node scripts/verify-notverse-reader-ui.mjs

      - name: Verify live persistent Inbox messaging
        id: inbox
        continue-on-error: true
        env:
          NOTVERSE_TEST_URL: https://notverse.1ink.online
        run: node scripts/verify-notverse-inbox-ui.mjs

      - name: Preserve production identity proof
        if: always()
        run: |
          mkdir -p engineering-evidence/notverse-live
          printf '%s\n' '${{ github.sha }}' > engineering-evidence/notverse-live/verification-branch-commit.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notverse-custom-domain-visual-proof
          path: |
            engineering-evidence/notverse-live
            engineering-evidence/notverse
          if-no-files-found: error
          retention-days: 14

      - name: Enforce the complete live proof
        if: always()
        run: |
          test '${{ steps.capture.outcome }}' = 'success'
          test '${{ steps.shell.outcome }}' = 'success'
          test '${{ steps.ui.outcome }}' = 'success'
          test '${{ steps.reader.outcome }}' = 'success'
          test '${{ steps.inbox.outcome }}' = 'success'
