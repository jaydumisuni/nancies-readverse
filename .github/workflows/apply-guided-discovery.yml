name: Apply guided discovery and library flow

on:
  push:
    branches: [implement-guided-discovery-library]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implement-guided-discovery-library
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Materialise guided discovery implementation
        run: node scripts/run-guided-discovery-transform.mjs
      - name: Restore strict production build command
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.scripts.build = 'npm run verify:architecture && tsc --noEmit && vite build';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
      - name: Verify architecture
        run: npm run verify:architecture
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        run: npx vite build
      - name: Verify materialised feature markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'type DiscoveryCandidate =' src/App.tsx
          grep -q 'function DiscoveryResultsCard' src/App.tsx
          grep -q 'Add to Library' src/App.tsx
          grep -q '/api/discovery/search' worker/index.ts
          grep -q '/api/discovery/source' worker/index.ts
          grep -q 'Guided discovery and source preparation' src/styles.css
      - name: Remove one-time transformation machinery
        shell: bash
        run: |
          rm -f scripts/implement-guided-discovery.mjs
          rm -f scripts/run-guided-discovery-transform.mjs
          rm -f .github/workflows/apply-guided-discovery.yml
          rm -f .guided-discovery-action-trigger
          rm -rf engineering-diagnostics
          rm -f public/guided-transform.txt public/guided-architecture.txt public/guided-types.txt
      - name: Commit completed implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ReadVerse Engineering'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Implement guided discovery and library saving'
          git push origin HEAD:implement-guided-discovery-library
