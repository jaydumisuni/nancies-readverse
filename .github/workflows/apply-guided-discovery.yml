name: Apply guided discovery and library flow

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implement-guided-discovery-library
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/implement-guided-discovery.mjs
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Commit implementation and remove one-time files
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/implement-guided-discovery.mjs
          rm .github/workflows/apply-guided-discovery.yml
          git config user.name "ReadVerse Engineering"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Implement guided discovery and library saving"
          git push origin HEAD:implement-guided-discovery-library
