name: Verify guided discovery implementation

on:
  push:
    branches: [implement-guided-discovery-library]
    paths-ignore:
      - engineering-diagnostics/**

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implement-guided-discovery-library
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Correct worker predicate typing
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('worker/index.ts')
          text = path.read_text()
          old = 'typeof item === "string" && item.trim()'
          new = 'typeof item === "string" && Boolean(item.trim())'
          if old not in text:
              raise SystemExit('worker predicate target not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Strict verification
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p engineering-diagnostics
          set +e
          npm install --no-audit --no-fund > engineering-diagnostics/install.txt 2>&1
          INSTALL=$?
          npm run verify:architecture > engineering-diagnostics/architecture.txt 2>&1
          ARCH=$?
          npx tsc --noEmit > engineering-diagnostics/types.txt 2>&1
          TYPES=$?
          npx vite build > engineering-diagnostics/vite.txt 2>&1
          VITE=$?
          printf 'install=%s\narchitecture=%s\ntypes=%s\nvite=%s\n' "$INSTALL" "$ARCH" "$TYPES" "$VITE" > engineering-diagnostics/build-status.txt
          cat engineering-diagnostics/types.txt
          test "$INSTALL" -eq 0 -a "$ARCH" -eq 0 -a "$TYPES" -eq 0 -a "$VITE" -eq 0
      - name: Commit correction and diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ReadVerse Engineering"
          git config user.email "actions@users.noreply.github.com"
          git add worker/index.ts engineering-diagnostics
          git commit -m "Fix guided discovery worker typing" || exit 0
          git push origin HEAD:implement-guided-discovery-library
