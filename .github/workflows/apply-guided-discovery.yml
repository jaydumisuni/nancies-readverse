name: Materialise guided discovery implementation

on:
  push:
    branches: [implement-guided-discovery-library]
    paths-ignore:
      - engineering-diagnostics/**

permissions:
  contents: write

jobs:
  materialise:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implement-guided-discovery-library
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialise source
        id: materialise
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p engineering-diagnostics
          set +e
          node scripts/run-guided-discovery-transform.mjs > engineering-diagnostics/transform.log 2>&1
          STATUS=$?
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          printf 'transform_exit=%s\n' "$STATUS" > engineering-diagnostics/workflow-status.txt
          cat engineering-diagnostics/transform.log
          exit "$STATUS"
      - name: Strict build
        id: build
        if: steps.materialise.outputs.status == '0'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm install --no-audit --no-fund > engineering-diagnostics/install.log 2>&1
          INSTALL=$?
          npm run verify:architecture > engineering-diagnostics/architecture.log 2>&1
          ARCH=$?
          npx tsc --noEmit > engineering-diagnostics/types.log 2>&1
          TYPES=$?
          npx vite build > engineering-diagnostics/vite.log 2>&1
          VITE=$?
          printf 'install=%s\narchitecture=%s\ntypes=%s\nvite=%s\n' "$INSTALL" "$ARCH" "$TYPES" "$VITE" > engineering-diagnostics/build-status.txt
          test "$INSTALL" -eq 0 -a "$ARCH" -eq 0 -a "$TYPES" -eq 0 -a "$VITE" -eq 0
      - name: Commit materialised source or diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ReadVerse Engineering"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.tsx src/reader/PdfBookReader.tsx src/styles.css worker/index.ts engineering-diagnostics
          git commit -m "Materialise guided discovery implementation" || exit 0
          git push origin HEAD:implement-guided-discovery-library
