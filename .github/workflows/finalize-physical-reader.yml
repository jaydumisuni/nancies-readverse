name: Finalize physical PDF reader

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/finish-reader-app.mjs
      - name: Build the canonical reader
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit canonical source and remove temporary patch machinery
        run: |
          rm -f scripts/finish-reader-app.mjs
          rm -f scripts/finalize-physical-reader.mjs
          rm -f .github/workflows/finalize-physical-reader.yml
          git config user.name "ReadVerse Reader Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Finalize the physical PDF reader"
          git push origin HEAD:${{ github.head_ref }}
