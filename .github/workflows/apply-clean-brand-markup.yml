name: Apply and prove clean NoTVerse markup

on:
  push:
    branches:
      - fix-approved-notverse-brand-workspace-20260802
    paths:
      - .apply-clean-brand-trigger
  pull_request:
    branches:
      - main
    types:
      - opened

permissions:
  contents: write

jobs:
  apply-build-prove-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-approved-notverse-brand-workspace-20260802

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply the workspace-proven markup cleanup
        run: node scripts/apply-clean-brand-markup.mjs

      - name: Strict build and architecture proof
        run: npm run build

      - name: Install browser proof tooling
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start exact production client locally
        run: |
          cat > /tmp/serve_notverse.py <<'PY'
          import json
          from http.server import ThreadingHTTPServer, SimpleHTTPRequestHandler
          from functools import partial

          class Handler(SimpleHTTPRequestHandler):
              def do_GET(self):
                  if self.path.split('?', 1)[0] == '/api/auth/google/status':
                      payload = json.dumps({'configured': False, 'connected': False, 'account': None}).encode('utf-8')
                      self.send_response(200)
                      self.send_header('Content-Type', 'application/json')
                      self.send_header('Content-Length', str(len(payload)))
                      self.end_headers()
                      self.wfile.write(payload)
                      return
                  return super().do_GET()

          ThreadingHTTPServer(('127.0.0.1', 4173), partial(Handler, directory='dist/client')).serve_forever()
          PY
          python3 /tmp/serve_notverse.py > /tmp/notverse-preview.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/notverse-preview.log
          exit 1

      - name: Setup, navigation and workspace proof
        run: node scripts/verify-notverse-ui.mjs
        env:
          NOTVERSE_TEST_URL: http://127.0.0.1:4173

      - name: Reader, Notes and Library proof
        run: node scripts/verify-notverse-reader-ui.mjs
        env:
          NOTVERSE_TEST_URL: http://127.0.0.1:4173

      - name: Persistent Inbox proof
        run: node scripts/verify-notverse-inbox-ui.mjs
        env:
          NOTVERSE_TEST_URL: http://127.0.0.1:4173

      - name: Approved artwork and mobile chat proof
        run: node scripts/verify-notverse-brand-mobile-chat.mjs
        env:
          NOTVERSE_TEST_URL: http://127.0.0.1:4173

      - name: Preserve exact proof
        if: always()
        run: |
          cp /tmp/notverse-preview.log engineering-evidence/notverse/preview.log 2>/dev/null || true
          printf '%s\n' '${{ github.sha }}' > engineering-evidence/notverse/verified-source-commit.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clean-notverse-brand-workspace-proof
          path: |
            engineering-evidence/notverse
            engineering-evidence/notverse-brand-mobile
          if-no-files-found: error
          retention-days: 14

      - name: Commit only the proven product files to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/notverse/SetupWizard.tsx src/App.tsx scripts/verify-notverse-brand-mobile-chat.mjs
          git commit -m "Remove duplicate NoTVerse branding markup"
          git push origin HEAD:fix-approved-notverse-brand-workspace-20260802
