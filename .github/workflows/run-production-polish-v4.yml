name: Run NoTVerse production polish v4

on:
  push:
    branches:
      - polish-notverse-production-20260806

permissions:
  contents: write

concurrency:
  group: notverse-production-polish-v4
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-notverse-production-20260806
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Run production candidate proof
        run: bash scripts/production-polish-runner-v4.sh
      - name: Upload proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notverse-production-ready-proof-v4
          path: |
            engineering-evidence/production-polish-local
            engineering-evidence/production-polish-preview
            engineering-evidence/production-polish-live
            engineering-evidence/production-polish-progress.txt
            engineering-evidence/production-polish-failure.txt
            engineering-evidence/production-polish-assets.json
            engineering-evidence/production-polish-release-summary.json
          if-no-files-found: warn
          retention-days: 14
