name: Apply direct NoTVerse Inbox correction

on:
  push:
    branches:
      - finish-notverse-10-for-2-20260731
    paths:
      - scripts/apply-inbox-fix.mjs
      - .github/workflows/apply-inbox-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finish-notverse-10-for-2-20260731
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply direct source correction
        run: node scripts/apply-inbox-fix.mjs

      - name: Commit canonical source only when changed
        run: |
          if git diff --quiet -- src/notverse/NoTVerseViews.tsx; then
            echo "Inbox source already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/notverse/NoTVerseViews.tsx
          git commit -m "Finish persistent NoTVerse Inbox messaging"
          git push origin HEAD:finish-notverse-10-for-2-20260731
