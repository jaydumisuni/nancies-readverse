name: Extract proven NoTVerse release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  extract:
    if: github.head_ref == 'release-notverse-production-20260811'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-notverse-production-20260811
          fetch-depth: 0
      - name: Copy only proven production files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin polish-notverse-production-20260806
          paths=(
            package.json
            social-worker/index.ts
            src/App.tsx
            src/main.tsx
            src/notverse/NoTVerseViews.tsx
            src/notverse/SetupWizard.tsx
            src/notverse/production-polish.css
            src/notverse/runtime-interaction-fix.ts
            worker/index.ts
            worker/smart-companion.ts
            scripts/verify-notverse-build.mjs
            scripts/verify-mobile-notes-chat.mjs
            scripts/verify-production-polish.mjs
            scripts/verify-public-ratings.mjs
            scripts/verify-live-public-ratings.mjs
            scripts/verify-live-companion-matrix.mjs
          )
          git checkout origin/polish-notverse-production-20260806 -- "${paths[@]}"
          git config user.name "NoTVerse Release"
          git config user.email "actions@users.noreply.github.com"
          git add -- "${paths[@]}"
          if git diff --cached --quiet; then
            echo "Clean production files are already synchronized."
            exit 0
          fi
          git commit -m "Extract clean proven NoTVerse production candidate"
          git push origin HEAD:release-notverse-production-20260811
