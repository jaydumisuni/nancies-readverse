name: Diagnose NoTVerse polish chat

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  inspect:
    if: github.head_ref == 'polish-notverse-production-20260806'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-notverse-production-20260806
      - name: Apply current workspace patches
        shell: bash
        run: |
          set -euo pipefail
          cat engineering-patches/production-polish/part-*.b64 | base64 --decode > /tmp/p.patch.gz
          gzip -dc /tmp/p.patch.gz > /tmp/p.patch
          git apply /tmp/p.patch
          git apply engineering-patches/production-polish/short-phone-home.patch
      - name: Show chat and recommendation implementation
        shell: bash
        run: |
          set -euo pipefail
          echo '=== matching implementation ==='
          grep -R -n -E -C 25 'The Biggest Bluff|reinforcement loops|gambling|fallback.*chat|mock.*chat|generate.*reply|companion.*reply' src worker.ts scripts || true
          echo '=== chat endpoint/fetch paths ==='
          grep -R -n -E -C 8 '/api/.*chat|fetch\(|companion.*message|message.*companion' src worker.ts | head -500 || true
