name: Finish ReadVerse 10-for-2

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  materialise-and-prove:
    if: github.event.pull_request.head.ref == 'finish-readverse-persistence-formats'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finish-readverse-persistence-formats
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialise direct source changes once
        shell: bash
        run: |
          if [ -f scripts/materialise-finished-readverse.py ]; then
            python3 scripts/materialise-finished-readverse.py
          fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Strict engineering build
        run: npm run build
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local Worker
        shell: bash
        run: |
          mkdir -p engineering-evidence/finished-readverse
          npx wrangler dev --local --config dist/nancies_readverse/wrangler.json --ip 127.0.0.1 --port 4173 > engineering-evidence/finished-readverse/server.log 2>&1 &
          echo $! > /tmp/readverse-server.pid
          READY=0
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:4173/api/health >/dev/null; then READY=1; break; fi
            sleep 1
          done
          test "$READY" -eq 1
      - name: Run desktop functional and visual proof
        run: node scripts/verify-finished-ui.mjs
        env:
          READVERSE_TEST_URL: http://127.0.0.1:4173
      - name: Stop local Worker
        if: always()
        run: kill $(cat /tmp/readverse-server.pid) 2>/dev/null || true
      - name: Commit canonical source and evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ReadVerse Engineering"
          git config user.email "actions@users.noreply.github.com"
          if [ -f scripts/materialise-finished-readverse.py ]; then git rm -f scripts/materialise-finished-readverse.py; fi
          git add package.json package-lock.json wrangler.jsonc worker/index.ts worker/platform.ts src public scripts engineering-evidence/finished-readverse
          git commit -m "Finish persistence, native readers and Google Drive integration" || exit 0
          git push origin HEAD:finish-readverse-persistence-formats
