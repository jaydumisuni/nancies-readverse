name: Use compatible PDF.js browser build

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/use-legacy-pdfjs.mjs
      - run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit compatible assets and remove patch files
        run: |
          rm scripts/use-legacy-pdfjs.mjs
          rm .github/workflows/use-legacy-pdfjs.yml
          rm -f package-lock.json
          git config user.name "ReadVerse Reader Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Use the compatible PDF.js browser build"
          git push origin HEAD:${{ github.head_ref }}
