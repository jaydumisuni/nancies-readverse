name: Mobile Notes and companion regression proof

on:
  push:
    branches:
      - fix/mobile-notes-chat-intelligence-20260803
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "worker/**"
      - "scripts/prove-mobile-notes-chat.mjs"
      - "scripts/prove-companion-runtime.mjs"
      - "package.json"
      - "wrangler.jsonc"
      - ".github/workflows/mobile-notes-chat-regression.yml"

permissions:
  contents: read

jobs:
  exact-browser-and-runtime-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Strict build
        run: npm run build

      - name: Install Playwright proof browser
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium

      - name: Start exact generated production client
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist/client > /tmp/notverse-preview.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/notverse-preview.log
          exit 1

      - name: Prove short-phone and tall-phone Notes/chat geometry
        run: node scripts/prove-mobile-notes-chat.mjs

      - name: Start exact generated Worker entry
        run: |
          npx wrangler dev --local --port 8790 --config dist/notverse/wrangler.json > /tmp/notverse-worker.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8790/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/notverse-worker.log
          exit 1

      - name: Prove recommendation request is not misrouted
        run: node scripts/prove-companion-runtime.mjs

      - name: Preserve logs
        if: always()
        run: |
          mkdir -p engineering-evidence/mobile-notes-chat
          cp /tmp/notverse-preview.log engineering-evidence/mobile-notes-chat/preview.log 2>/dev/null || true
          cp /tmp/notverse-worker.log engineering-evidence/mobile-notes-chat/worker.log 2>/dev/null || true
          git rev-parse HEAD > engineering-evidence/mobile-notes-chat/verified-commit.txt

      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-notes-chat-exact-proof
          path: engineering-evidence/mobile-notes-chat
          if-no-files-found: error
          retention-days: 14
