name: Mobile Notes and companion regression proof
# Authority sweep proof trigger: run the exact final PR graph through Chromium and WebKit.

on:
  push:
    branches:
      - fix/mobile-notes-chat-intelligence-20260803
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "worker/**"
      - "scripts/prove-mobile-native-screens.mjs"
      - "scripts/prove-mobile-touch-targets.mjs"
      - "scripts/prove-notes-social-loop.mjs"
      - "scripts/prove-companion-runtime.mjs"
      - "scripts/diagnose-webkit-chat-viewport.mjs"
      - "package.json"
      - "wrangler.jsonc"
      - ".github/workflows/mobile-notes-chat-regression.yml"

permissions:
  contents: read

jobs:
  exact-browser-and-runtime-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Strict build
        run: npm run build

      - name: Install proof packages matching the prebuilt browsers
        run: npm install --no-save --no-audit --no-fund playwright@1.62.0 http-server@14.1.1

      - name: Start exact generated production client
        run: |
          npx http-server dist/client -a 127.0.0.1 -p 4173 -c-1 > /tmp/notverse-preview.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/notverse-preview.log
          exit 1

      - name: Diagnose WebKit Chat viewport cascade
        run: node scripts/diagnose-webkit-chat-viewport.mjs

      - name: Prove current native Chat, Comments and Inbox screens
        run: node scripts/prove-mobile-native-screens.mjs

      - name: Prove visible mobile controls, Notes gestures and Search
        run: node scripts/prove-mobile-touch-targets.mjs

      - name: Prove Notes social loop, activity, share and real comments
        run: node scripts/prove-notes-social-loop.mjs

      - name: Start exact generated Worker entry
        run: |
          npx wrangler dev --local --port 8790 --config dist/nancies_readverse/wrangler.json > /tmp/notverse-worker.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8790/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/notverse-worker.log
          exit 1

      - name: Prove recommendation request is not misrouted
        run: node scripts/prove-companion-runtime.mjs

      - name: Preserve logs
        if: always()
        run: |
          mkdir -p engineering-evidence/mobile-notes-chat
          cp /tmp/notverse-preview.log engineering-evidence/mobile-notes-chat/preview.log 2>/dev/null || true
          cp /tmp/notverse-worker.log engineering-evidence/mobile-notes-chat/worker.log 2>/dev/null || true
          git rev-parse HEAD > engineering-evidence/mobile-notes-chat/verified-commit.txt

      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-notes-chat-exact-proof
          path: |
            engineering-evidence/mobile-notes-chat
            engineering-evidence/mobile-native-screens
            engineering-evidence/mobile-touch-targets
            engineering-evidence/notes-social-completion
            engineering-evidence/webkit-chat-diagnose
          if-no-files-found: error
          retention-days: 14
