name: Probe NoTVerse branch-native Actions
on:
  push:
    branches:
      - polish-notverse-production-20260806
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-notverse-production-20260806
      - run: |
          printf 'branch action ran for %s\n' "$GITHUB_SHA" > action-probe-result.txt
          git config user.name 'NoTVerse Verification'
          git config user.email 'actions@users.noreply.github.com'
          git add action-probe-result.txt
          git commit -m 'Record branch-native Actions probe'
          git push origin HEAD:polish-notverse-production-20260806
