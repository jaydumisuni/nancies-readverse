name: Prove focused Inbox mobile keyboard

on:
  push:
    branches:
      - proof/mobile-keyboard-clean8-20260814

permissions:
  contents: read

jobs:
  exact-mobile-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Freeze seven candidate files
        run: |
          test "$(git hash-object src/main.tsx)" = "908974bab50b9e98239632f901d596db3bcdea24"
          test "$(git hash-object src/notverse/focused-inbox-viewport.css)" = "180dd8a6de4a35aea35b11c64034eab6b240194e"
          test "$(git hash-object src/notverse/ios-visual-viewport-recovery.ts)" = "13d2f0c0899aa6b92fbe6cf588ef3d121dfb420c"
          test "$(git hash-object src/notverse/ios-visual-viewport-recovery.css)" = "06314c8c99ef0777e562cc25d0673b0202ffa450"
          test "$(git hash-object scripts/prove-ios-overlay-recovery.mjs)" = "2d30de25d25c781c6bb0718d347ad438abf37036"
          test "$(git hash-object scripts/prove-mobile-notes-chat.mjs)" = "dac10813de8b3840f046aeb3da5e15e2c6fec350"
          test "$(git hash-object scripts/prove-mobile-polish-visual.mjs)" = "5ac171ce044a3b47a4d5592ab6870dce264bf288"
          node --check scripts/prove-ios-overlay-recovery.mjs

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Strict build
        run: npm run build

      - name: Install Playwright proof browsers
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium webkit

      - name: Start exact generated production client
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist/client > /tmp/notverse-preview.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/notverse-preview.log
          exit 1

      - name: Prove short-phone and tall-phone Notes/chat geometry
        run: node scripts/prove-mobile-notes-chat.mjs

      - name: Prove mobile chat drafts Inbox clearance and Search visually
        run: node scripts/prove-mobile-polish-visual.mjs

      - name: Prove strict Chat Replies Inbox keyboard edge
        run: node scripts/prove-ios-overlay-recovery.mjs

      - name: Start exact generated Worker entry
        run: |
          npx wrangler dev --local --port 8790 --config dist/notverse/wrangler.json > /tmp/notverse-worker.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8790/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/notverse-worker.log
          exit 1

      - name: Prove recommendation request is not misrouted
        run: node scripts/prove-companion-runtime.mjs

      - name: Preserve proof metadata
        if: always()
        run: |
          mkdir -p engineering-evidence/focused-inbox-keyboard
          printf '%s\n' 'fix-mobile-keyboard-composers-clean8-20260814' > engineering-evidence/focused-inbox-keyboard/candidate-branch.txt
          git rev-parse HEAD > engineering-evidence/focused-inbox-keyboard/runner-commit.txt
          cp /tmp/notverse-preview.log engineering-evidence/focused-inbox-keyboard/preview.log 2>/dev/null || true
          cp /tmp/notverse-worker.log engineering-evidence/focused-inbox-keyboard/worker.log 2>/dev/null || true

      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-inbox-keyboard-proof
          path: |
            engineering-evidence/focused-inbox-keyboard
            engineering-evidence/mobile-notes-chat
            engineering-evidence/ios-overlay-recovery
          if-no-files-found: error
          retention-days: 14
