name: Diagnose Inbox height ownership
on:
  push:
    branches:
      - proof/mobile-keyboard-clean8-20260814
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Freeze clean8 product candidate
        run: |
          git diff --quiet 21d00ca0006349752c3de1bbf16f5a9c252cc430 -- src/notverse/ios-visual-viewport-recovery.ts src/notverse/ios-visual-viewport-recovery.css scripts/prove-ios-overlay-recovery.mjs scripts/prove-mobile-notes-chat.mjs scripts/prove-mobile-polish-visual.mjs
          test "$(git hash-object src/notverse/ios-visual-viewport-recovery.css)" = "06314c8c99ef0777e562cc25d0673b0202ffa450"
      - name: Build exact candidate
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Install Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Start generated production client
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist/client > /tmp/notverse-preview.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/notverse-preview.log
          exit 1
      - name: Print focused Inbox geometry
        run: node scripts/diagnose-inbox-height.mjs
