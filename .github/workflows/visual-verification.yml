name: Visual verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [visual-verification]

jobs:
  verify-live-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/visual-verify.mjs
        env:
          READVERSE_URL: https://nancies-readverse.pharrtechnolgiescoltd.workers.dev/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readverse-visual-evidence
          path: visual-evidence
          if-no-files-found: warn
