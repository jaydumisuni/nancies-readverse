name: Install physical PDF reader

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the reader into the approved UI
        run: node scripts/install-physical-reader.mjs
      - name: Verify the production build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit the canonical reader and remove one-time installer
        run: |
          rm scripts/install-physical-reader.mjs
          rm .github/workflows/install-physical-reader.yml
          git config user.name "ReadVerse Reader Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.tsx scripts/install-physical-reader.mjs .github/workflows/install-physical-reader.yml
          git commit -m "Connect the physical PDF reader"
          git push origin HEAD:${{ github.head_ref }}
