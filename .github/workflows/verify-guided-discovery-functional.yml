name: Verify guided discovery functional flow

on:
  push:
    branches: [implement-guided-discovery-library]
    paths-ignore:
      - engineering-evidence/**
      - engineering-diagnostics/**

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implement-guided-discovery-library
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build
        run: |
          npm install --no-audit --no-fund
          npm install --no-save playwright
          npx playwright install chromium
          npm run build
      - name: Run browser verification
        shell: bash
        run: |
          mkdir -p engineering-evidence/guided-discovery
          npx wrangler dev --local --config dist/nancies_readverse/wrangler.json --ip 127.0.0.1 --port 4173 > engineering-evidence/guided-discovery/server.txt 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then READY=1; break; fi
            sleep 1
          done
          test "$READY" -eq 1
          node scripts/verify-guided-discovery.mjs
      - name: Commit verification evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ReadVerse Engineering"
          git config user.email "actions@users.noreply.github.com"
          git add engineering-evidence/guided-discovery
          git commit -m "Record guided discovery functional evidence" || exit 0
          git push origin HEAD:implement-guided-discovery-library
