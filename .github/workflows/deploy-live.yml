name: Deploy and verify NoTVerse live

on:
  push:
    branches: [main]

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Strict build
        run: npm run build
      - name: Deploy canonical Worker and frontend assets
        run: npx wrangler deploy --config dist/nancies_readverse/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Wait for deployment propagation
        run: sleep 20
      - name: Verify deployed NoTVerse visually
        run: node scripts/verify-notverse-live.mjs
        env:
          NOTVERSE_URL: https://nancies-readverse.pharrtechnolgiescoltd.workers.dev/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notverse-live-visual-evidence
          path: engineering-evidence/notverse-live
          if-no-files-found: warn
