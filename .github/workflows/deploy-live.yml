name: Verify NoTVerse locally before deployment

on:
  push:
    branches: [verify-notverse-before-deploy-20260730]
  workflow_dispatch:

jobs:
  build-and-visual-proof:
    if: ${{ !contains(github.event.head_commit.message, '[visual-proof]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Strict build
        run: npm run build
      - name: Start exact built app
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/notverse-preview.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/notverse-preview.log
          exit 1
      - name: Verify current NoTVerse visually
        run: node scripts/verify-notverse-ui.mjs
      - name: Preserve proof in verification branch
        if: always()
        run: |
          mkdir -p engineering-evidence/current-notverse
          cp -f engineering-evidence/notverse/* engineering-evidence/current-notverse/ 2>/dev/null || true
          cp -f /tmp/notverse-preview.log engineering-evidence/current-notverse/preview.log 2>/dev/null || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add engineering-evidence/current-notverse
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "[visual-proof] Preserve current NoTVerse local evidence"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-notverse-visual-evidence
          path: |
            engineering-evidence/current-notverse
            engineering-evidence/notverse
          if-no-files-found: warn
          retention-days: 7
