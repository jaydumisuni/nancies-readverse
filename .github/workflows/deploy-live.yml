name: Verify NoTVerse locally before deployment

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-visual-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Strict build
        run: npm run build
      - name: Start exact built app
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/notverse-preview.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/notverse-preview.log
          exit 1
      - name: Verify current NoTVerse visually
        run: node scripts/verify-notverse-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-notverse-visual-evidence
          path: |
            engineering-evidence/notverse
            /tmp/notverse-preview.log
          if-no-files-found: warn
          retention-days: 7
