name: Approved UI verification

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify approved Mei Mei asset
        run: |
          node <<'NODE'
          const assert = require('assert/strict');
          const crypto = require('crypto');
          const fs = require('fs');
          const bytes = fs.readFileSync('public/avatars/meimei.webp');
          assert.equal(bytes.length, 47814);
          assert.equal(bytes.subarray(0, 4).toString('ascii'), 'RIFF');
          assert.equal(bytes.subarray(8, 12).toString('ascii'), 'WEBP');
          assert.equal(crypto.createHash('sha256').update(bytes).digest('hex'), '04bdb67840daa2d8bb93879aa2f14da13b8f4e89bb9738a6e3fae53c605ea521');
          assert.match(fs.readFileSync('src/avatars.ts', 'utf8'), /mei:\s*"\/avatars\/meimei\.webp"/);
          NODE

      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium

      - name: Ten-front functional and visual gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ui-preview
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist/client > ui-preview/server.log 2>&1 &
          SERVER_PID=$!
          ready=0
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then cat ui-preview/server.log; exit 1; fi

          node <<'NODE'
          const assert = require('assert/strict');
          const fs = require('fs');
          const { chromium } = require('playwright');

          const results = [];
          const pass = (name, detail = 'passed') => results.push({ name, status: 'passed', detail });

          (async () => {
            const browser = await chromium.launch({ headless: true });

            const desktop = await browser.newContext({ viewport: { width: 1440, height: 1100 }, deviceScaleFactor: 1 });
            const page = await desktop.newPage();
            const desktopErrors = [];
            page.on('console', message => { if (message.type() === 'error') desktopErrors.push(message.text()); });
            page.on('pageerror', error => desktopErrors.push(String(error)));
            await page.goto('http://127.0.0.1:4173', { waitUntil: 'networkidle', timeout: 90000 });

            assert.equal(await page.locator('.brand .nancy').textContent(), 'Nancy’s');
            assert.equal(await page.locator('.brand .readverse').textContent(), 'READVERSE');
            pass('1. Branding and desktop shell');

            assert.equal(await page.locator('.book-card').count(), 5);
            assert.equal(await page.locator('.mood-row button').count(), 5);
            pass('2. Dashboard shelf, features and moods');

            await page.locator('.sidebar nav button').filter({ hasText: 'Settings' }).click();
            await page.locator('.modal.open').waitFor({ state: 'visible' });
            assert.equal(await page.locator('.companion-option').count(), 12);
            pass('3. Twelve-companion settings grid');

            await page.locator('.companion-option').filter({ hasText: 'Itachi' }).click();
            await page.locator('.color-dot').nth(3).click();
            await page.locator('.companion-option').filter({ hasText: 'Gojo' }).click();
            await page.locator('.companion-option').filter({ hasText: 'Itachi' }).click();
            const ringColour = await page.locator('.selected-portrait').evaluate(element => getComputedStyle(element).borderTopColor);
            assert.equal(ringColour, 'rgb(88, 184, 255)');
            pass('4. Companion switching and independent ring memory');

            await page.locator('.settings-tabs button').filter({ hasText: 'Appearance' }).click();
            await page.locator('.theme-tile').filter({ hasText: 'Midnight Violet' }).click();
            await page.locator('.settings-head .icon-btn').click();
            await page.locator('.modal').waitFor({ state: 'hidden' });
            assert.equal(await page.locator('.companion-card .mini strong').textContent(), 'Itachi');
            assert.equal(await page.locator('.rv-app').evaluate(element => element.style.getPropertyValue('--accent')), '#9b6dff');
            pass('5. Theme selection without changing companion ring');

            await page.locator('.companion-card .btn.primary').click();
            await page.locator('.chat-panel.open').waitFor({ state: 'visible' });
            await page.locator('.chat-form input').fill('Recommend something dark but clever');
            await page.locator('.chat-form .send').click();
            assert.equal(await page.locator('.message.user').count(), 1);
            assert.ok((await page.locator('.message.companion').count()) >= 2);
            pass('6. Companion chat interaction');

            await page.locator('.chat-head .icon-btn').click();
            const pdf = Buffer.from('%PDF-1.4\n1 0 obj<<>>endobj\ntrailer<<>>\n%%EOF');
            await page.locator('input[type="file"]').setInputFiles({ name: 'nancy-test.pdf', mimeType: 'application/pdf', buffer: pdf });
            await page.locator('.file-pill.show').waitFor({ state: 'visible' });
            await page.locator('.chat-form .send').click();
            await page.locator('.reader-overlay.open').waitFor({ state: 'visible' });
            const pdfSource = await page.locator('.pdf-frame').getAttribute('src');
            assert.ok(pdfSource && pdfSource.startsWith('blob:'));
            pass('7. Temporary PDF upload opens in the reader');

            assert.equal(await page.locator('.reader-toolbar button').filter({ hasText: 'Fullscreen' }).count(), 1);
            await page.locator('.reader-toolbar button').filter({ hasText: 'Notes' }).click();
            await page.locator('.notepad.open').waitFor({ state: 'visible' });
            assert.ok((await page.locator('.notepad textarea').inputValue()).length > 0);
            pass('8. Reader fullscreen control and notepad');

            await page.locator('.notepad header button').click();
            await page.locator('.reader-toolbar > button').first().click();
            await page.locator('.sidebar nav button').filter({ hasText: 'Sources' }).click();
            await page.locator('.source-dialog.open').waitFor({ state: 'visible' });
            await page.locator('.source-card input').fill('https://example.com/reader/book');
            await page.locator('.source-card .btn.primary').click();
            await page.locator('.chat-panel.open').waitFor({ state: 'visible' });
            assert.ok((await page.locator('.message.user').last().textContent()).includes('https://example.com/reader/book'));
            pass('9. Source-link handoff into temporary session');

            await page.locator('.chat-head .icon-btn').click();
            await page.screenshot({ path: 'ui-preview/desktop.png', fullPage: true });
            fs.writeFileSync('ui-preview/desktop.json', JSON.stringify({ errors: desktopErrors }, null, 2));
            await desktop.close();

            const mobile = await browser.newContext({ viewport: { width: 390, height: 844 }, isMobile: true, deviceScaleFactor: 1 });
            const mobilePage = await mobile.newPage();
            const mobileErrors = [];
            mobilePage.on('console', message => { if (message.type() === 'error') mobileErrors.push(message.text()); });
            mobilePage.on('pageerror', error => mobileErrors.push(String(error)));
            await mobilePage.goto('http://127.0.0.1:4173', { waitUntil: 'networkidle', timeout: 90000 });
            assert.equal(await mobilePage.locator('.mobile-brand .nancy').textContent(), 'Nancy’s');
            assert.equal(await mobilePage.locator('.mobile-brand .readverse').textContent(), 'READVERSE');
            assert.equal(await mobilePage.locator('.bottom-nav button').count(), 5);
            assert.equal(await mobilePage.locator('.hero-character').evaluate(element => getComputedStyle(element).display), 'none');
            await mobilePage.screenshot({ path: 'ui-preview/mobile.png', fullPage: false });
            await mobilePage.locator('.bottom-nav button').last().click();
            await mobilePage.locator('.modal.open').waitFor({ state: 'visible' });
            assert.equal(await mobilePage.locator('.companion-option').count(), 12);
            const overflow = await mobilePage.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth);
            assert.ok(overflow <= 1, `Mobile horizontal overflow: ${overflow}px`);
            await mobilePage.screenshot({ path: 'ui-preview/settings-mobile.png', fullPage: false });
            fs.writeFileSync('ui-preview/mobile.json', JSON.stringify({ errors: mobileErrors }, null, 2));
            pass('10. Responsive mobile dashboard, navigation and settings');
            await mobile.close();

            fs.writeFileSync('ui-preview/functional-results.json', JSON.stringify({ status: 'passed', checks: results }, null, 2));
            await browser.close();
          })().catch(error => {
            fs.writeFileSync('ui-preview/functional-results.json', JSON.stringify({ status: 'failed', checks: results, error: String(error), stack: error.stack }, null, 2));
            console.error(error);
            process.exit(1);
          });
          NODE
          kill "$SERVER_PID" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-ui-verification
          path: ui-preview
          if-no-files-found: error
