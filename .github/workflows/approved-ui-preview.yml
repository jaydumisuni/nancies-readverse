name: Approved UI preview

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Capture desktop, mobile and settings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ui-preview
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist/client > ui-preview/server.log 2>&1 &
          SERVER_PID=$!
          ready=0
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            cat ui-preview/server.log
            exit 1
          fi
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const targets = [
              { name: 'desktop', width: 1440, height: 1100, mobile: false },
              { name: 'mobile', width: 390, height: 844, mobile: true },
              { name: 'settings-mobile', width: 390, height: 844, mobile: true, settings: true },
            ];
            for (const item of targets) {
              const context = await browser.newContext({ viewport: { width: item.width, height: item.height }, isMobile: item.mobile, deviceScaleFactor: 1 });
              const page = await context.newPage();
              const errors = [];
              page.on('console', message => { if (message.type() === 'error') errors.push(message.text()); });
              page.on('pageerror', error => errors.push(String(error)));
              await page.goto('http://127.0.0.1:4173', { waitUntil: 'networkidle', timeout: 90000 });
              if (item.settings) {
                await page.locator('.bottom-nav button').last().click();
                await page.locator('.modal.open').waitFor({ state: 'visible', timeout: 10000 });
              }
              await page.screenshot({ path: `ui-preview/${item.name}.png`, fullPage: true });
              fs.writeFileSync(`ui-preview/${item.name}.json`, JSON.stringify({ errors, url: page.url() }, null, 2));
              await context.close();
            }
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
          kill "$SERVER_PID" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-ui-preview
          path: ui-preview
          if-no-files-found: error
