name: Approved UI preview

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Assemble and verify approved Mei Mei portrait
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f public/avatars/meimei.webp ]; then
            for part in .tmp/meimei/part{00..07}; do
              test -s "$part"
            done
            mkdir -p public/avatars
            {
              head -c 8000 .tmp/meimei/part00
              cat .tmp/meimei/part01 .tmp/meimei/part02 .tmp/meimei/part03
              head -c 2907 .tmp/meimei/part04
              tail -c +2909 .tmp/meimei/part04
              cat .tmp/meimei/part05 .tmp/meimei/part06 .tmp/meimei/part07
            } | tr -d '\r\n' | base64 -d > public/avatars/meimei.webp
          fi

          node <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');

          const portraitPath = 'public/avatars/meimei.webp';
          const bytes = fs.readFileSync(portraitPath);
          const sha256 = crypto.createHash('sha256').update(bytes).digest('hex');
          const expectedSize = 47814;
          const expectedSha256 = '04bdb67840daa2d8bb93879aa2f14da13b8f4e89bb9738a6e3fae53c605ea521';

          if (bytes.length !== expectedSize) throw new Error(`Unexpected Mei Mei portrait size: ${bytes.length}`);
          if (bytes.subarray(0, 4).toString('ascii') !== 'RIFF' || bytes.subarray(8, 12).toString('ascii') !== 'WEBP') {
            throw new Error('Approved Mei Mei portrait is not a valid WebP');
          }
          if (sha256 !== expectedSha256) throw new Error(`Approved Mei Mei portrait checksum mismatch: ${sha256}`);

          const avatarsPath = 'src/avatars.ts';
          let source = fs.readFileSync(avatarsPath, 'utf8');
          source = source.replace(/mei:\s*groupD\.meimei,?/, 'mei: "/avatars/meimei.webp",');
          source = source.replace(/mei:\s*"\/avatars\/meimei\.(?:png|webp)",?/, 'mei: "/avatars/meimei.webp",');
          if (!source.includes('mei: "/avatars/meimei.webp",')) throw new Error('Approved Mei Mei mapping was not written');
          fs.writeFileSync(avatarsPath, source);
          console.log(`Verified approved Mei Mei portrait: ${bytes.length} bytes, ${sha256}`);
          NODE

      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium

      - name: Capture desktop, mobile and settings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ui-preview
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist/client > ui-preview/server.log 2>&1 &
          SERVER_PID=$!
          ready=0
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then cat ui-preview/server.log; exit 1; fi

          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const targets = [
              { name: 'desktop', width: 1440, height: 1100, mobile: false, fullPage: true },
              { name: 'mobile', width: 390, height: 844, mobile: true, fullPage: false },
              { name: 'settings-mobile', width: 390, height: 844, mobile: true, settings: true, fullPage: false },
            ];
            for (const item of targets) {
              const context = await browser.newContext({ viewport: { width: item.width, height: item.height }, isMobile: item.mobile, deviceScaleFactor: 1 });
              const page = await context.newPage();
              const errors = [];
              page.on('console', message => { if (message.type() === 'error') errors.push(message.text()); });
              page.on('pageerror', error => errors.push(String(error)));
              await page.goto('http://127.0.0.1:4173', { waitUntil: 'networkidle', timeout: 90000 });
              if (item.settings) {
                await page.locator('.bottom-nav button').last().click();
                await page.locator('.modal.open').waitFor({ state: 'visible', timeout: 10000 });
              }
              await page.screenshot({ path: `ui-preview/${item.name}.png`, fullPage: item.fullPage });
              fs.writeFileSync(`ui-preview/${item.name}.json`, JSON.stringify({ errors, url: page.url() }, null, 2));
              await context.close();
            }
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
          kill "$SERVER_PID" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-ui-preview
          path: ui-preview
          if-no-files-found: error

      - name: Commit approved portrait and remove temporary recovery files
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp/meimei
          rmdir .tmp 2>/dev/null || true
          rm -f .github/workflows/install-approved-meimei.yml
          rm -f .github/workflows/assemble-approved-meimei.yml
          rm -f .github/workflows/meimei-diagnostics.yml

          git config user.name "ReadVerse UI Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Use the approved Mei Mei portrait"
            git push origin HEAD:${{ github.head_ref }}
          fi
