name: NoTVerse production proof

on:
  push:
    branches: [verify-notverse-production]
    paths:
      - .notverse-production-trigger
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  verify-production:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'verify-notverse-production'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verify-notverse-production
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect main deployment workflow
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_DEPLOY_SHA: c2b7e2f87fdd73fe97969f8f9de411f3e26579bd
        run: |
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$MAIN_DEPLOY_SHA" \
            | jq '{total_count, runs: [.workflow_runs[] | {id, name, event, status, conclusion, head_sha, html_url}]}' \
            | tee /tmp/main-deployment-runs.json
      - name: Install browser proof dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify both production domains visually
        run: node scripts/verify-notverse-production.mjs
      - name: Upload live visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notverse-production-evidence
          path: engineering-evidence/notverse-production
          if-no-files-found: error
