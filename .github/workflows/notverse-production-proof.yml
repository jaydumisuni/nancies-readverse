name: NoTVerse production proof

on:
  push:
    branches: [verify-notverse-production]
    paths:
      - .notverse-production-trigger
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy-and-verify-production:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'verify-notverse-production'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verify-notverse-production
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Strict build
        run: npm run build
      - name: Deploy canonical NoTVerse Worker
        run: npx wrangler deploy --config dist/nancies_readverse/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Install browser proof dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Wait for production propagation
        run: sleep 20
      - name: Verify both production domains visually
        run: node scripts/verify-notverse-production.mjs
      - name: Upload live visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notverse-production-evidence
          path: engineering-evidence/notverse-production
          if-no-files-found: error
