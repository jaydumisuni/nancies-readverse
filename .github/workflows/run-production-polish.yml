name: Run isolated NoTVerse production polish
on:
  push:
    branches:
      - polish-notverse-production-20260806
permissions:
  contents: write
concurrency:
  group: notverse-production-polish
  cancel-in-progress: true
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-notverse-production-20260806
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare the isolated proof runner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/production-polish-runner.sh')
          text = path.read_text()
          needle = "git apply engineering-patches/production-polish/short-phone-home.patch || fail short-phone-patch-apply\n"
          addition = needle + "git apply --check engineering-patches/production-polish/mobile-home-viewport.patch || fail mobile-home-patch-check\n" + "git apply engineering-patches/production-polish/mobile-home-viewport.patch || fail mobile-home-patch-apply\n"
          if needle not in text:
              raise SystemExit('Expected short-phone patch application was not found')
          text = text.replace(needle, addition, 1)
          text = text.replace('git commit -m "$message" -- "$@"', 'git commit -m "$message [skip ci]" -- "$@"')
          text = text.replace("git commit -m 'Polish NoTVerse interactions, intelligence and public ratings'", "git commit -m 'Polish NoTVerse interactions, intelligence and public ratings [skip ci]'")
          text = text.replace("git commit -m 'Freeze proven NoTVerse production candidate'", "git commit -m 'Freeze proven NoTVerse production candidate [skip ci]'")
          old = '    tail -n 260 "$RUNLOG" 2>/dev/null || true\n'
          new = old + '    printf "\\n--- verifier geometry section ---\\n"\n    sed -n "105,145p" scripts/verify-production-polish.mjs 2>/dev/null || true\n'
          if old in text:
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Run the production candidate gate
        run: bash scripts/production-polish-runner.sh
      - name: Upload retained evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notverse-production-ready-proof
          path: |
            engineering-evidence/production-polish-local
            engineering-evidence/production-polish-preview
            engineering-evidence/production-polish-live
            engineering-evidence/production-polish-progress.txt
            engineering-evidence/production-polish-failure.txt
            engineering-evidence/production-polish-release-summary.json
          if-no-files-found: warn
          retention-days: 14
