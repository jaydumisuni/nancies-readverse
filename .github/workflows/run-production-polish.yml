name: Run isolated NoTVerse production polish
on:
  push:
    branches:
      - polish-notverse-production-20260806
permissions:
  contents: write
concurrency:
  group: notverse-production-polish
  cancel-in-progress: true
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-notverse-production-20260806
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare the isolated proof runner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/production-polish-runner.sh')
          text = path.read_text()
          needle = "git apply engineering-patches/production-polish/short-phone-home.patch || fail short-phone-patch-apply\n"
          addition = needle + "git apply --check engineering-patches/production-polish/mobile-home-viewport.patch || fail mobile-home-patch-check\n" + "git apply engineering-patches/production-polish/mobile-home-viewport.patch || fail mobile-home-patch-apply\n"
          if needle not in text:
              raise SystemExit('Expected short-phone patch application was not found')
          text = text.replace(needle, addition, 1)
          text = text.replace('git commit -m "$message" -- "$@"', 'git commit -m "$message [skip ci]" -- "$@"')
          text = text.replace("git commit -m 'Polish NoTVerse interactions, intelligence and public ratings'", "git commit -m 'Polish NoTVerse interactions, intelligence and public ratings [skip ci]'")
          text = text.replace("git commit -m 'Freeze proven NoTVerse production candidate'", "git commit -m 'Freeze proven NoTVerse production candidate [skip ci]'")

          marker = "path.write_text(text[:start] + route + text[end:])\nPY\n"
          verifier_patch = r'''path.write_text(text[:start] + route + text[end:])

# Replace the first overlap assertion with a clipping-aware geometry check. This
# rejects controls that are actually painted beneath the fixed mobile nav while
# not misclassifying descendants clipped by the protected scroll viewport.
text = path.read_text()
fn_start = text.find('async function assertNoNavigationOverlap(page, label) {')
fn_end = text.find('\n}\n\n', fn_start)
if fn_start < 0 or fn_end < 0:
    raise SystemExit('Expected mobile navigation overlap assertion was not found')
fn_end += 3
replacement = r'''async function assertNoNavigationOverlap(page, label) {
  const result = await page.evaluate(() => {
    const clippedRect = (element) => {
      const style = getComputedStyle(element);
      if (style.display === "none" || style.visibility === "hidden" || Number(style.opacity) <= 0) return null;
      const source = element.getBoundingClientRect();
      let left = Math.max(0, source.left);
      let top = Math.max(0, source.top);
      let right = Math.min(innerWidth, source.right);
      let bottom = Math.min(innerHeight, source.bottom);
      for (let parent = element.parentElement; parent; parent = parent.parentElement) {
        const parentStyle = getComputedStyle(parent);
        const clipsX = /(hidden|auto|scroll|clip)/.test(parentStyle.overflowX) || /(hidden|auto|scroll|clip)/.test(parentStyle.overflow);
        const clipsY = /(hidden|auto|scroll|clip)/.test(parentStyle.overflowY) || /(hidden|auto|scroll|clip)/.test(parentStyle.overflow);
        if (!clipsX && !clipsY) continue;
        const box = parent.getBoundingClientRect();
        if (clipsX) { left = Math.max(left, box.left); right = Math.min(right, box.right); }
        if (clipsY) { top = Math.max(top, box.top); bottom = Math.min(bottom, box.bottom); }
      }
      return right > left && bottom > top ? { left, top, right, bottom } : null;
    };
    const nav = document.querySelector(".notverse-mobile-nav");
    const navBox = nav ? clippedRect(nav) : null;
    if (!nav || !navBox) return [];
    return [...document.querySelectorAll("button,input,textarea,select,a[href]")]
      .filter((element) => !nav.contains(element))
      .map((element) => ({ element, box: clippedRect(element) }))
      .filter(({ box }) => box && box.left < navBox.right && box.right > navBox.left && box.top < navBox.bottom && box.bottom > navBox.top)
      .map(({ element }) => ({ tag: element.tagName, text: (element.textContent || element.getAttribute("aria-label") || element.getAttribute("placeholder") || "").trim().slice(0, 80) }));
  });
  assert(result.length === 0, `${label}: controls hidden behind mobile navigation: ${JSON.stringify(result)}`);
}'''
path.write_text(text[:fn_start] + replacement + text[fn_end:])
PY
'''
          if marker not in text:
              raise SystemExit('Expected verifier-adjustment marker was not found')
          text = text.replace(marker, verifier_patch, 1)

          old = '    tail -n 260 "$RUNLOG" 2>/dev/null || true\n'
          new = old + '    printf "\\n--- verifier geometry section ---\\n"\n    sed -n "105,165p" scripts/verify-production-polish.mjs 2>/dev/null || true\n'
          if old in text:
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Run the production candidate gate
        run: bash scripts/production-polish-runner.sh
      - name: Upload retained evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notverse-production-ready-proof
          path: |
            engineering-evidence/production-polish-local
            engineering-evidence/production-polish-preview
            engineering-evidence/production-polish-live
            engineering-evidence/production-polish-progress.txt
            engineering-evidence/production-polish-failure.txt
            engineering-evidence/production-polish-release-summary.json
          if-no-files-found: warn
          retention-days: 14
