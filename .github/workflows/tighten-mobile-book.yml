name: Tighten mobile physical book

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/tighten-mobile-book.mjs
      - run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit canonical mobile styling and remove patch files
        run: |
          rm scripts/tighten-mobile-book.mjs
          rm .github/workflows/tighten-mobile-book.yml
          rm -f package-lock.json
          git config user.name "ReadVerse Reader Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Tighten the mobile physical book shell"
          git push origin HEAD:${{ github.head_ref }}
