name: Verify production video-approved UI

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/verify-production-video-ui.yml

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and Chromium
        run: |
          npm install --no-audit --no-fund
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Verify deployed UI, reader, sources and twelve companions
        run: node scripts/verify-live-core.mjs
        env:
          READVERSE_URL: https://nancies-readverse.pharrtechnolgiescoltd.workers.dev/

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-video-ui-evidence
          path: live-evidence
          if-no-files-found: error
