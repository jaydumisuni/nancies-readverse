name: Shadow iPhone Visual Lab v0.5 campaign proof

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/shadow-iphone-lab-capture-campaign.mjs"
      - "scripts/shadow-iphone-lab-notverse-campaign.json"
      - ".github/workflows/shadow-iphone-lab-campaign-v050.yml"

permissions:
  contents: read

jobs:
  declarative-campaign-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Strict build
        run: npm run build
      - name: Install proof packages matching prebuilt browsers
        run: npm install --no-save --no-audit --no-fund playwright@1.62.0 http-server@14.1.1
      - name: Start exact generated production client
        run: |
          npx http-server dist/client -a 127.0.0.1 -p 4173 -c-1 > /tmp/notverse-preview.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/notverse-preview.log
          exit 1
      - name: Execute declarative iPhone campaign
        run: |
          node scripts/shadow-iphone-lab-capture-campaign.mjs \
            --campaign scripts/shadow-iphone-lab-notverse-campaign.json \
            --out engineering-evidence/iphone-lab-v050-candidate
      - name: Preserve product source identity
        run: git rev-parse HEAD > engineering-evidence/iphone-lab-v050-candidate/verified-commit.txt
      - name: Upload declarative campaign candidate
        uses: actions/upload-artifact@v4
        with:
          name: iphone-visual-lab-v050-candidate
          path: engineering-evidence/iphone-lab-v050-candidate
          if-no-files-found: error
          retention-days: 14
