name: Export NoTVerse workspace source

on:
  push:
    branches:
      - workspace-export-notverse-20260802
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Confirm build packages are complete
        run: |
          test -f node_modules/vite/dist/node/index.js
          test -f node_modules/@vitejs/plugin-react/dist/index.js
          test -f node_modules/@cloudflare/vite-plugin/dist/index.mjs || test -f node_modules/@cloudflare/vite-plugin/dist/index.js

      - name: Package exact workspace source
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=dist --exclude=.wrangler -czf /tmp/notverse-source.tar.gz .

      - name: Package dependency tree directly
        run: |
          tar --hard-dereference -czf /tmp/notverse-node-modules.tar.gz node_modules

      - name: Upload exact workspace source
        uses: actions/upload-artifact@v4
        with:
          name: notverse-workspace-source
          path: /tmp/notverse-source.tar.gz
          retention-days: 2

      - name: Upload dependency tree
        uses: actions/upload-artifact@v4
        with:
          name: notverse-node-modules
          path: /tmp/notverse-node-modules.tar.gz
          retention-days: 2
