name: Export NoTVerse workspace source

on:
  push:
    branches:
      - workspace-export-notverse-20260802
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Package source and dependencies
        run: |
          mkdir -p workspace-export
          rsync -a ./ workspace-export/ \
            --exclude '.git' \
            --exclude 'dist' \
            --exclude 'workspace-export'
          tar -czf notverse-workspace-with-deps.tar.gz workspace-export

      - name: Upload complete local workspace
        uses: actions/upload-artifact@v4
        with:
          name: notverse-workspace-with-deps
          path: notverse-workspace-with-deps.tar.gz
          retention-days: 2
