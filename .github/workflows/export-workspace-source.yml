name: Export NoTVerse workspace source

on:
  push:
    branches:
      - workspace-export-notverse-20260802

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4

      - name: Package source without generated dependencies
        run: |
          mkdir -p workspace-export
          rsync -a ./ workspace-export/ \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'dist' \
            --exclude 'workspace-export'
          tar -czf notverse-workspace-source.tar.gz workspace-export

      - name: Upload workspace source
        uses: actions/upload-artifact@v4
        with:
          name: notverse-workspace-source
          path: notverse-workspace-source.tar.gz
          retention-days: 2
